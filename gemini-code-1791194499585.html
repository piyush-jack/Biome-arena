// --- MULTIPLAYER ENGINE (PeerJS) ---
let peer = null, connections = [], isHost = false, roomSeed = 100;

function initNetwork(roomId, asHost) {
  isHost = asHost;
  const prefix = "biome-arena-ffa-room-";
  const fullId = prefix + roomId.trim().toLowerCase();
  
  peer = new Peer(asHost ? fullId : undefined);
  
  peer.on('open', (id) => {
    $('netStatus').textContent = asHost ? `Room active! Hosting as: ${roomId}` : `Connected to Peer server as client.`;
    if (!asHost) {
      const conn = peer.connect(fullId);
      setupConn(conn);
    }
  });

  peer.on('connection', (conn) => {
    setupConn(conn);
    if(isHost) {
      // Send current game seed to incoming player
      conn.on('open', () => {
        conn.send({ type: 'init', seed: seed });
      });
    }
  });

  peer.on('error', (err) => {
    console.error(err);
    $('netStatus').textContent = "Error: Room exists or connection failed.";
  });
}

function setupConn(conn) {
  connections.push(conn);
  conn.on('data', (data) => handleNetworkData(data, conn));
  conn.on('close', () => {
    connections = connections.filter(c => c !== conn);
  });
}

function broadcast(data) {
  for (let c of connections) {
    if (c.open) c.send(data);
  }
}

function handleNetworkData(data, conn) {
  if (data.type === 'init') {
    seed = data.seed;
    start();
  } else if (data.type === 'state') {
    let peerActor = actors.find(a => a.netId === data.id);
    if (!peerActor) {
      peerActor = mk(actors.length, data.w || 'rifle', false, true);
      peerActor.netId = data.id;
      peerActor.name = data.name || ("Peer " + data.id.substring(0,4));
      actors.push(peerActor);
      spawn(peerActor);
    }
    peerActor.p.set(data.x, data.y, data.z);
    peerActor.yaw = data.yaw;
    peerActor.pitch = data.pitch;
    peerActor.hp = data.hp;
    peerActor.w = data.w;
    peerActor.alive = data.alive;
    if (peerActor.mesh) peerActor.mesh.visible = peerActor.alive;
  } else if (data.type === 'fire') {
    let peerActor = actors.find(a => a.netId === data.id);
    if (peerActor) {
      const d = new V(data.dx, data.dy, data.dz);
      fire(peerActor, d, 1);
    }
  }
}
